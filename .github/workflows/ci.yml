name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: TypeScript
        run: npm run typecheck

      - name: Deno check Sync backend
        run: deno check supabase/functions/_shared/sync-pipeline.ts supabase/functions/cron-pipeline-sync/index.ts supabase/functions/sync-meli-orders/index.ts

      - name: Production build
        run: npm run build
